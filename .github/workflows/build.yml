name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'

      - name: Create Android platform files
        run: flutter create --platforms=android .

      - name: Fix minSdkVersion
        run: python -c "import re; p='android/app/build.gradle'; s=open(p).read(); s=re.sub(r'minSdkVersion\s+\d+', 'minSdkVersion 21', s); open(p,'w').write(s)"

      - name: Verify minSdkVersion
        run: grep -n "minSdkVersion" android/app/build.gradle

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
